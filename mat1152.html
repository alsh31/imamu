["Which of the following is a statement?","x + 3 = 5|What time is it?|The number 7 is prime",2,"الجملة الخبرية لها قيمة صدق محددة. المعادلة x+3=5 تعتمد على x، والسؤال ليس خبرًا."],
["P: It is cold. Q: It is sunny. “It is cold but not sunny” is:","P ∨ ¬Q|P ∧ ¬Q|¬P ∧ Q",1,"كلمة but تعني ∧. فتصبح: P ∧ ¬Q."],
["P is true and Q is false. The truth value of P ⇒ Q is:","True|False|Cannot be determined",1,"الشرطية تكون خاطئة في حالة واحدة فقط: T ⇒ F."],
["If P is false, then P ⇒ Q is:","True|False|Cannot be determined",0,"المقدمة الخاطئة تجعل الشرطية صحيحة دائمًا (vacuous truth)."],
["A is true, B is false. The truth value of (A ∨ B) ∧ ¬(A ∧ B) is:","True|False|Cannot be determined",0,"A∨B = T، و A∧B = F فـ ¬(A∧B) = T. إذن T ∧ T = T."],
["If P ⇒ Q is true and Q is false, then P is:","True|False|Cannot be determined",1,"لو كانت P صحيحة لأصبحت P⇒Q خاطئة (T⇒F). إذن P خاطئة (modus tollens)."],
["The number of rows in the truth table of a statement with 3 variables is:","6|8|9",1,"عدد الصفوف 2ⁿ، أي 2³ = 8."],
["“7 is prime or 9 is prime” is:","True|False|Cannot be determined",0,"الـ or تكفي فيها عبارة صحيحة واحدة، و 7 عدد أولي."],
["P ⇔ Q is true exactly when:","P and Q have the same truth value|P is true|P and Q have different truth values",0,"التكافؤ صحيح عندما تتفق P و Q في القيمة (TT أو FF)."],
["The converse of P ⇒ Q is:","Q ⇒ P|¬P ⇒ ¬Q|¬Q ⇒ ¬P",0,"العكس (converse) يبدّل المقدمة والنتيجة فقط: Q⇒P."],
["The contrapositive of P ⇒ Q is:","Q ⇒ P|¬P ⇒ ¬Q|¬Q ⇒ ¬P",2,"المعاكس الإيجابي: نبدّل ونُنفي الطرفين، ¬Q⇒¬P، ويكافئ الأصل."],

["P ⇒ (P ∨ Q) is:","a tautology|a contradiction|neither",0,"إذا كانت P خاطئة فالشرطية T، وإذا كانت P صحيحة فـ P∨Q صحيحة. إذن صحيحة دائمًا."],
["The inverse of P ⇒ Q is:","Q ⇒ P|¬P ⇒ ¬Q|¬Q ⇒ ¬P",1,"المعكوس (inverse) ننفي فيه الطرفين دون تبديل: ¬P⇒¬Q."],
["Which statement is false?","2+2=4 and 3 is odd|2+2=5 or 3 is odd|2+2=5 and 3 is odd",2,"∧ تحتاج الطرفين صحيحين، و 2+2=5 خاطئة."],
["P ⇒ Q is false and P is true. Then Q is:","True|False|Cannot be determined",1,"الشرطية الخاطئة حالتها الوحيدة T⇒F، فتكون Q خاطئة."],
["If P is true, then P ∨ Q is:","True|False|Cannot be determined",0,"∨ تكفي فيها عبارة صحيحة واحدة."],
["P ∨ Q is true and P is false. Then Q is:","True|False|Cannot be determined",0,"لا بد أن تكون إحدى العبارتين صحيحة، و P خاطئة، إذن Q صحيحة."],
["The truth table of a statement with 4 variables has how many rows?","8|16|12",1,"2⁴ = 16."],

["Chapter 1 – Logic: Equivalences & Negation",[
["¬(P ⇒ Q) is logically equivalent to:","¬P ⇒ ¬Q|P ∧ ¬Q|¬P ∨ Q",1,"نفي الشرطية = المقدمة صحيحة والنتيجة خاطئة: P ∧ ¬Q. (خطأ شائع: ¬P⇒¬Q)."],
["¬(P ∨ Q) is logically equivalent to:","¬P ∨ ¬Q|¬P ∧ ¬Q|P ∧ Q",1,"قانون دي مورغان: ننفي الطرفين ونقلب ∨ إلى ∧."],
["¬(P ∧ Q) is logically equivalent to:","¬P ∧ ¬Q|¬P ∨ ¬Q|P ∨ Q",1,"دي مورغان: ننفي الطرفين ونقلب ∧ إلى ∨."],
["P ⇒ Q is logically equivalent to:","P ∨ Q|¬P ∨ Q|P ∧ ¬Q",1,"P⇒Q تكون خاطئة فقط عند T⇒F، وهذا يطابق ¬P∨Q."],
["P ∧ (Q ∨ R) is logically equivalent to:","(P ∧ Q) ∨ R|(P ∨ Q) ∧ (P ∨ R)|(P ∧ Q) ∨ (P ∧ R)",2,"قانون التوزيع: ∧ توزّع على ∨."],
["¬(P ⇔ Q) is logically equivalent to:","(P ∧ ¬Q) ∨ (¬P ∧ Q)|(P ∧ Q) ∨ (¬P ∧ ¬Q)|P ⇒ Q",0,"التكافؤ خاطئ عندما يختلف P و Q، وهذا ما تعبّر عنه الإجابة الأولى (XOR)."],
["P ∨ (P ∧ Q) is equivalent to:","P|Q|P ∧ Q",0,"قانون الامتصاص: النتيجة P دائمًا."],
["(P ∨ ¬Q) ∧ (P ∨ Q) is equivalent to:","Q|P|P ∧ Q",1,"نوزّع: P ∨ (¬Q ∧ Q) = P ∨ F = P. انتبه: الرمز بين الطرفين ∨ وليس ∧."],
["Negation of “If f is differentiable at a, then f is continuous at a”:","If f is not differentiable, then f is not continuous|f is differentiable at a and not continuous at a|If f is not continuous, then f is not differentiable",1,"نفي P⇒Q هو P∧¬Q. الخيار الأول هو inverse والثالث هو contrapositive (وكلاهما ليس النفي)."],
["P ⇔ Q is equivalent to:","(P ⇒ Q) ∧ (Q ⇒ P)|(P ⇒ Q) ∨ (Q ⇒ P)|P ∧ Q",0,"التكافؤ شرطيتان في الاتجاهين معًا (∧)."],
["¬(¬P ∨ Q) is equivalent to:","P ∨ ¬Q|P ∧ ¬Q|¬P ∧ Q",1,"دي مورغان: ¬(¬P)∧¬Q = P∧¬Q."],
["P ∧ (P ∨ Q) is equivalent to:","P|Q|P ∨ Q",0,"قانون الامتصاص."],
["(P ⇒ Q) ∧ (P ⇒ ¬Q) is equivalent to:","¬P|P|Q",0,"≡ P⇒(Q∧¬Q) ≡ P⇒F ≡ ¬P ∨ F ≡ ¬P."],
["Negation of “n is even and n > 5”:","n is odd and n ≤ 5|n is odd or n ≤ 5|n is even or n > 5",1,"دي مورغان: ¬(A∧B) = ¬A∨¬B."],
["Negation of “If it rains, the match is cancelled”:","If it does not rain, the match is not cancelled|It rains and the match is not cancelled|The match is cancelled and it does not rain",1,"¬(P⇒Q) ≡ P∧¬Q."],
["Negation of “Ali passed Math or Physics”:","Ali failed Math and Physics|Ali failed Math or Physics|Ali passed Math and Physics",0,"¬(A∨B) = ¬A∧¬B: رسب في الاثنين."],
["The converse of “If it rains, the road is wet” is:","If the road is wet, then it rains|If it does not rain, the road is not wet|If the road is not wet, then it does not rain",0,"العكس converse يبدّل المقدمة والنتيجة فقط."],
["The contrapositive of “If it rains, the road is wet” is:","If the road is wet, then it rains|If it does not rain, the road is not wet|If the road is not wet, then it does not rain",2,"المعاكس الإيجابي: ننفي الطرفين ونبدّلهما، ويكافئ الجملة الأصلية."],
["(P ∧ Q) ∨ (P ∧ ¬Q) is equivalent to:","P|Q|F",0,"P ∧ (Q ∨ ¬Q) ≡ P ∧ T ≡ P."]]],
["Chapter 1 – Logic: Quantifiers",[
["The negation of (∀x∈Z)(x² ≥ x) is:","(∃x∈Z)(x² ≥ x)|(∀x∈Z)(x² ≤ x)|(∃x∈Z)(x² < x)",2,"ننفي ∀ فتصبح ∃، وننفي x²≥x فتصبح x²<x."],

["The negation of “All students passed” is:","No student passed|Some student did not pass|Some student passed",1,"نفي ∀ هو ∃ مع نفي الخبر: يوجد طالب لم ينجح."],
["Which statement is true?","(∃!x∈Z)(x² = 4)|(∃!x∈Z)(x + 3 = 5)|(∃!x∈Z)(x² = −4)",1,"x+3=5 له حل وحيد x=2. أما x²=4 فله حلان (±2)، و x²=−4 لا حل له."],
["Which statement is true?","(∀x∈R)(x² > 0)|(∀x∈R)(x² ≥ 0)|(∀x∈R)(x > x²)",1,"x²≥0 دائمًا. الأولى تفشل عند x=0، والثالثة تفشل عند x=2."],
["The truth set of {x∈Z : |x| < 0} is:","∅|{0}|Z",0,"القيمة المطلقة لا تكون سالبة، فلا يوجد أي عدد يحقق الشرط."],
["The truth set of {x∈Z : x² < 10} is:","{−3,…,3}|{0,1,2,3}|{−2,…,2}",0,"3²=9<10 و 4²=16 لا تحقق. إذن من −3 إلى 3."],
["(∃y∈Z)(∀x∈Z)(x + y = 0) is:","True|False|Cannot be determined",1,"يجب أن يكون y=−x لكل x في وقت واحد، وهذا مستحيل. (عكس الترتيب ∀x∃y صحيح)."],
["A counterexample to (∀n∈N)(n² > n) is:","n = 1|n = 2|n = 3",0,"1² = 1 وليست أكبر من 1. المثال المضاد يجعل الجملة خاطئة."],
["The negation of (∀x∈R)(∃y∈R)(x + y = 0) is:","(∃x∈R)(∀y∈R)(x + y ≠ 0)|(∀x∈R)(∃y∈R)(x + y ≠ 0)|(∃x∈R)(∃y∈R)(x + y ≠ 0)",0,"نقلب كل كمية (∀↔∃) وننفي الجملة الأخيرة."],
["(∀x∈Z)(∃y∈Z)(x + y = 0) is:","True|False|Cannot be determined",0,"لكل x نختار y = −x."],
["(∃!x∈R)(2x + 1 = 7) is:","True|False|Cannot be determined",0,"الحل الوحيد x = 3."],
["The truth set of {x∈N : x + 2 = 5} is:","{3}|{−3}|∅",0,"x = 3 عدد طبيعي ويحقق المعادلة."],
["The truth set of {x∈Z : x² = 9} is:","{3}|{−3, 3}|{9}",1,"3² = 9 و (−3)² = 9."],
["Which statement is false?","(∃x∈Z)(x² = 4)|(∀x∈Z)(x² = 4)|(∃x∈Z)(x² = 0)",1,"∀ تفشل بمثال مضاد، مثل x = 1."],
["The negation of (∀x∈R)(x² > 0) is:","(∃x∈R)(x² ≤ 0)|(∀x∈R)(x² ≤ 0)|(∃x∈R)(x² < 0)",0,"∀ تصبح ∃ والعلاقة > تصبح ≤ (وليس <). والجملة الأصلية خاطئة عند x = 0."],
["Which statement is true?","(∃x∈N)(x + 1 = 0)|(∀x∈N)(x < 0)|(∃x∈Z)(x + 1 = 0)",2,"x = −1 عدد صحيح يحقق المعادلة، أما في N فلا يوجد حل."]]],
["Chapter 2 – Proofs",[
["To prove by contraposition “if n² is even, then n is even”, we prove:","if n is even, then n² is even|if n is odd, then n² is odd|if n² is odd, then n is even",1,"المعاكس الإيجابي: ننفي الطرفين ونبدّلهما."],
["To prove by contraposition “if 3n+2 is odd, then n is odd”, we prove:","if n is even, then 3n+2 is even|if n is odd, then 3n+2 is odd|if 3n+2 is even, then n is odd",0,"ننفي odd فتصبح even في الطرفين ونبدّلهما."],
["To prove P ⇒ Q by contradiction we assume:","¬P ∧ Q|P ∧ ¬Q|¬P ⇒ ¬Q",1,"نفترض أن P صحيحة و Q خاطئة، ثم نصل إلى تناقض."],
["The sum of two odd integers is:","odd|even|can be either",1,"(2a+1)+(2b+1) = 2(a+b+1) وهو زوجي."],
["If n = 2k, then n²/2 + 1 equals:","2k² + 1|4k² + 1|2k + 1",0,"n² = 4k² فيكون n²/2 = 2k² (وليس 4k). الناتج 2k²+1 فردي."],
["In 54 = 2a + (2b + 1), why use different letters a and b?","The two integers are independent|To make it longer|It does not matter",0,"العددان مستقلان. استخدام نفس k يفرض علاقة بينهما ويُنقص الدرجة."],
["The product of two odd integers is:","odd|even|can be either",0,"(2a+1)(2b+1) = 2(2ab+a+b) + 1 وهو فردي."],
["The product of an even integer and any integer is:","even|odd|can be either",0,"(2k)·m = 2(km) زوجي."],
["If n = 2k + 1, then n² equals:","4k² + 4k + 1|4k² + 1|2k² + 1",0,"(2k+1)² = 4k²+4k+1 (لا تنسَ الحد الأوسط)."],
["A proof that starts “Let n = 2k” is about:","even integers|odd integers|any integer",0,"n = 2k تعني أن n زوجي."],
["In a proof by contradiction, reaching a contradiction shows that:","the assumption is false|the assumption is true|nothing",0,"التناقض يعني أن الافتراض خاطئ، فتكون الجملة الأصلية صحيحة."],
["To prove “if n is odd then n² is odd” directly, we start with:","n = 2k + 1|n = 2k|n² = 2k + 1",0,"البرهان المباشر يبدأ بالمقدمة: n فردي، أي n = 2k+1."],
["Which technique starts by assuming P ∧ ¬Q?","Proof by contradiction|Direct proof|Proof by cases",0,"في التناقض نفترض أن P صحيحة و Q خاطئة ثم نصل إلى تناقض."],
["To prove P ⇔ Q we must prove:","P ⇒ Q and Q ⇒ P|P ⇒ Q only|¬P ⇒ ¬Q only",0,"التكافؤ شرطية في الاتجاهين."],
["A proof by cases for all integers n can consider:","n even and n odd|n > 0 only|n = 1 only",0,"كل عدد صحيح إما زوجي أو فردي، فنغطي كل الحالات."],
["If n is odd, then:","n = 2k + 1 for some integer k|n = 2k for some integer k|n = k² for some integer k",0,"تعريف العدد الفردي: 2k+1."],

["Chapter 3 – Sets",[

["A = {1,2,3}, B = {2,3,4}. A ∩ B equals:","{2,3}|{1,2,3,4}|{1,4}",0,"التقاطع: العناصر المشتركة بين A و B."],

["If |A| = 2 and |B| = 3, then |A × B| equals:","5|6|9",1,"حاصل الضرب الديكارتي عدد عناصره 2·3 = 6."],
["The power set P(A) of A = {a, b} is:","{∅,{a},{b},{a,b}}|{{a},{b}}|{a,b}",0,"P(A) هي مجموعة كل المجموعات الجزئية، وعددها 4."],
["A ∪ B for A = {1,2}, B = {2,3} is:","{1,2,3}|{2}|{1,3}",0,"الاتحاد يجمع كل العناصر بدون تكرار."],
["A ⊆ B and B ⊆ A together mean:","A = B|A ⊂ B (proper)|A ∩ B = ∅",0,"تعريف تساوي المجموعات: كل منهما جزئية من الأخرى."],
["The complement A′ (in universe U) is:","all elements of U not in A|A ∩ U|U ∪ A",0,"المتمم هو ما ليس في A داخل U."],

["As ordered pairs, is (1,2) = (2,1)?","No|Yes|Depends on the universe",0,"الزوج المرتب يهتم بالترتيب، فهما مختلفان."]]],
["Chapter 4 – Relations",[

["R is symmetric if:","(a,b) ∈ R ⇒ (b,a) ∈ R|(a,a) ∈ R for all a|(a,b),(b,c) ∈ R ⇒ (a,c) ∈ R",0,"التماثل: لو (a,b) في R فيجب (b,a) أيضًا."],
["R is transitive if:","(a,b),(b,c) ∈ R ⇒ (a,c) ∈ R|(a,a) ∈ R for all a|(a,b) ∈ R ⇒ (b,a) ∈ R",0,"التعدي: a→b و b→c تعني a→c."],
["An equivalence relation is:","reflexive, symmetric and transitive|reflexive and symmetric only|symmetric and transitive only",0,"علاقة التكافؤ تجمع الخصائص الثلاث معًا."],
["A = {1,2,3}, R = {(1,1),(2,2)}. R is:","not reflexive|reflexive|an equivalence relation",0,"ينقص (3,3)، فليست انعكاسية."],
["The equivalence classes of an equivalence relation on A:","form a partition of A|may overlap|are always singletons",0,"الأصناف متفرقة ومجموعها A، أي تقسيم (partition)."],

["Dom(R) for R = {(1,a),(2,b),(1,c)} is:","{1,2}|{a,b,c}|{1,2,a,b,c}",0,"المجال هو المركبات الأولى فقط."],

["Chapter 5 – Functions",[
["A relation f from A to B is a function if:","every a ∈ A has exactly one image in B|every b ∈ B has exactly one preimage|f is symmetric",0,"الدالة: كل عنصر في المجال له صورة واحدة فقط."],
["f is one-to-one if:","f(x₁) = f(x₂) ⇒ x₁ = x₂|every b has a preimage|f(x) = x",0,"الأحادية: لا عنصرين مختلفين لهما نفس الصورة."],
["f : A → B is onto if:","every b ∈ B equals f(a) for some a|f(x₁) = f(x₂) ⇒ x₁ = x₂|Dom(f) = B",0,"الشمولية: كل عنصر في المدى المصاحب له أصل."],
["f(x) = 2x + 1 from R to R is:","one-to-one and onto|one-to-one but not onto|onto but not one-to-one",0,"نحل y = 2x+1 فنجد x = (y−1)/2 لكل y، وهي أحادية أيضًا."],
["f(x) = x² from R to R is:","not one-to-one|one-to-one|onto",0,"f(2) = f(−2) = 4، فليست أحادية (وليست شاملة أيضًا)."],
["f(x) = x + 1, g(x) = 2x. (g ∘ f)(3) equals:","8|7|6",0,"(g∘f)(3) = g(f(3)) = g(4) = 8."],
["f has an inverse function iff f is:","one-to-one and onto|one-to-one only|onto only",0,"الدالة العكسية تحتاج أحادية وشاملة (تقابل)."],
["The domain of f : A → B is:","A|B|A × B",0,"المجال Dom(f) هو A، والمجال المصاحب codomain هو B."],

["Chapter 6 – Mathematical Induction",[

["The basis step for 1 + 2 + … + n = n(n+1)/2 checks:","n = 1|n = 0 only|n = k+1",0,"عند n=1: الطرف الأيسر 1 والأيمن 1·2/2 = 1."],

["The inductive hypothesis is:","assume P(k) is true|assume P(k+1) is true|assume P(1) is false",0,"نفترض صحة P(k) لعدد k ثم نبرهن P(k+1)."],
["Induction proves statements for:","all natural numbers n ≥ n₀|all real numbers|all integers",0,"الاستقراء يعمل على الأعداد الطبيعية ابتداءً من n₀."],
["1 + 3 + … + (2n − 1) equals:","n²|2n|n(n + 1)",0,"مجموع أول n عدد فردي = n²."]]],
["Chapter 9 – Binary Operations",[

["* is associative if:","(a*b)*c = a*(b*c)|a*b = b*a|a*b ∈ A",0,"الدمج: طريقة تجميع الأقواس لا تؤثر."],
